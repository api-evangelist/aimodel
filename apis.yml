aid: aimodel
name: AI model
description: >-
  AI model株式会社 (AI model Inc.) is a Tokyo generative-AI company, founded in August 2020 and
  headquartered in the Sumitomo Fudosan Toranomon Tower, Minato-ku, that generates and licenses
  photorealistic AI models and AI talent for apparel, e-commerce and advertising imagery. Its
  service replaces conventional model photography for product shots (ささげ), key visuals,
  lookbooks, television commercials, outdoor advertising and in-store POP, and it co-developed the
  AI character MirAI with Canon Marketing Japan. Its November 2024 Series A was backed by SBI
  Investment, NTT Docomo Ventures, the Canon Marketing Japan MIRAI Fund with Global Brain,
  Mitsukoshi Isetan Innovations, Sazaby League and Mitsubishi UFJ Capital; EquityZen reports a
  pre-Series B round with SBI Investment and Canon MJ CVC as of January 2026. AI model sells a
  managed creative service, not software: it publishes no developer portal, no API reference, no
  pricing page, no SDKs and no terms of service, and api., docs., developer., developers. and app.
  under ai-model.jp do not resolve. The one public, anonymous, machine-readable surface on its
  estate is the WordPress REST API behind www.ai-model.jp, which serves its published AI model
  roster (8 records), company news (39), pages, the media library and site-wide search - captured
  here as three derived OpenAPI documents.
