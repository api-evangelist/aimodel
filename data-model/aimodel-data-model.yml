gaps:
- entity: models-cat
  issue: >-
    The taxonomy that groups models (ASIA, and the other terms used at /models/) has
    show_in_rest disabled, so /wp/v2/taxonomies does not list it and there is no
    /wp/v2/models-cat collection. A consumer can only recover the term by parsing class_list.
  fix_owner: provider
