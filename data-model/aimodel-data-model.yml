summary: >-
  A WordPress content graph. Four custom post types (models, news, careerinfo, notification) sit
  alongside core pages, media and categories. The distinctive entity is `model` - one published
  AI-generated model - whose category is encoded only in class_list, because the models-cat
  taxonomy behind /models/<slug>/ is registered in WordPress but NOT exposed on the REST API.
