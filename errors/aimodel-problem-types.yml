    type: string
    description: Human-readable message, returned in Japanese.
  - name: data.status
    type: integer
    description: The HTTP status code, repeated in the body.
  - name: data.params
    type: object
    description: Map of parameter name to failure message. Present on validation errors only.
  - name: data.details
    type: object
    description: Map of parameter name to a nested {code, message, data} object. Present on validation errors only.
