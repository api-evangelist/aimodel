        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        required: false
        description: コレクションの現在のページ。
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: 結果として返される項目の最大数。
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: search
        in: query
        required: false
        description: 文字列に一致するものに結果を限定します。
        schema:
          type: string
      - name: after
        in: query
        required: false
        description: 入力された ISO8601 準拠の日付より後に公開された投稿にレスポンスを限定します。
        schema:
          type: string
          format: date-time
      - name: modified_after
        in: query
        required: false
        description: 入力された ISO8601 準拠の日付より後に更新された投稿にレスポンスを限定します。
